name: github pages

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pin Hugo for compatibility with the legacy Tranquilpeak theme.
          hugo-version: '0.125.7'
          extended: true

      - name: Build
        run: hugo --minify

      # Make the actual rendered homepage and the original branding assets
      # available for screenshot review without deploying the PR to the live site.
      - name: Upload PR site preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scoped-site-preview
          retention-days: 7
          if-no-files-found: error
          path: |
            public/index.html
            public/css/
            public/js/
            public/fonts/
            public/images/scoped_logo.jpg
            public/images/SCOPED_slide.jpg
            public/images/scoped_banner.jpg
            public/images/DASpng.jpg

      - name: Deploy (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
